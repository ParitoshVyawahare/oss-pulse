[project]
name = "oss-pulse"
version = "0.1.0"
description = "Product analytics on real GitHub event data: Airflow, dbt, Snowflake, MetricFlow."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyarrow>=17",
    "orjson>=3.10",
]

[project.scripts]
oss-pulse-ingest = "oss_pulse_ingest.cli:main"
oss-pulse-check-catalog = "oss_pulse_ingest.check_catalog:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion/src/oss_pulse_ingest"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
