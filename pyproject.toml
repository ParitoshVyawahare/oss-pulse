[project]
name = "oss-pulse"
version = "0.1.0"
description = "Product analytics on real GitHub event data: Airflow, dbt, Snowflake, MetricFlow."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyarrow>=17",
    "snowflake-connector-python>=4.8.0",
]

[project.scripts]
oss-pulse-check-catalog = "oss_pulse_ingest.check_catalog:main"
oss-pulse-extract = "oss_pulse_ingest.extract_cli:main"
oss-pulse-load = "oss_pulse_ingest.load_cli:main"

[dependency-groups]
dbt = [
    "dbt-snowflake>=1.12.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion/src/oss_pulse_ingest"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["airflow/.astro"]  # generated and managed by the Astro CLI
force-exclude = true  # apply excludes even when pre-commit passes files directly

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
